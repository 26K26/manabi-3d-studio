name: Kiri local integration build (experimental)

on:
  push:
    branches:
      - experiment/kiri-local
    paths:
      - '.github/workflows/kiri-local-build.yml'
      - 'experiments/kiri-local/**'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout Manabi 3D Studio experiment
        uses: actions/checkout@v4

      - name: Checkout pinned Kiri:Moto source
        uses: actions/checkout@v4
        with:
          repository: GridSpace/grid-apps
          ref: d138275bbe9d4e4030d8cb8b2dcf66607da9295a
          path: upstream

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Kiri build dependencies
        working-directory: upstream
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Patch in binary STL bridge
        run: node experiments/kiri-local/patch-upstream.mjs upstream

      - name: Build external dependencies
        working-directory: upstream
        run: npm run webpack-ext

      - name: Build Kiri UI and slicer workers
        working-directory: upstream
        run: npm run webpack-src

      - name: Prepare self-hosted site
        run: |
          mkdir -p test-site
          cp index.html test-site/index.html
          node experiments/kiri-local/build-static.mjs upstream test-site

      - name: Validate packaged assets and module syntax
        run: |
          test -s test-site/kiri-local/kiri/index.html
          test -s test-site/kiri-local/lib/main/kiri.js
          test -s test-site/kiri-local/lib/kiri/run/worker.js
          test -s test-site/kiri-local/lib/kiri/run/minion.js
          node --check test-site/kiri-local/lib/main/kiri.js
          node --check test-site/kiri-local/lib/kiri/run/worker.js
          node --check test-site/kiri-local/lib/kiri/run/minion.js
          node -e "const fs=require('fs');const s=fs.readFileSync('test-site/index.html','utf8');if(!s.includes('src=\"./kiri-local/kiri/\"'))process.exit(1)"

      - name: Install Chromium test harness
        run: |
          npm install --no-audit --no-fund --no-save playwright
          npx playwright install --with-deps webkit
          command -v google-chrome || command -v chromium || command -v chromium-browser

      - name: Verify CAD STL slicing reaches Kiri slice.end in Chromium
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          CHROME_BIN="$CHROME_BIN" node experiments/kiri-local/smoke.mjs test-site

      - name: Verify direct slicing in Safari-like WebKit
        env:
          BROWSER: webkit
        run: |
          node experiments/kiri-local/smoke.mjs test-site

      - name: Upload test site (not a production deployment)
        uses: actions/upload-artifact@v4
        with:
          name: manabi-kiri-local-experiment
          path: test-site/
          retention-days: 7

      - name: Checkout stable main without changing its root app
        uses: actions/checkout@v4
        with:
          ref: main
          path: publish
          persist-credentials: true

      - name: Stage isolated Kiri experiment on Pages path
        run: |
          mkdir -p publish/kiri-local publish/preview/kiri-local
          rsync -a --delete test-site/kiri-local/ publish/kiri-local/
          cp test-site/index.html publish/preview/kiri-local/index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('publish/preview/kiri-local/index.html')
          s=p.read_text(encoding='utf-8')
          old='src="./kiri-local/kiri/"'
          if s.count(old)!=1:
              raise SystemExit('preview iframe source was not found exactly once')
          s=s.replace(old,'src="../../kiri-local/kiri/"')
          s=s.replace("kiri.src='./kiri-local/kiri/?", "kiri.src='../../kiri-local/kiri/?")
          p.write_text(s,encoding='utf-8')
          PY
          touch publish/.nojekyll
          grep -F 'src="../../kiri-local/kiri/"' publish/preview/kiri-local/index.html
          test -s publish/kiri-local/lib/kiri/run/worker.js

      - name: Publish experiment subdirectory while preserving original app
        working-directory: publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A kiri-local preview/kiri-local .nojekyll
          if git diff --cached --quiet; then
            echo 'No changes to preview assets'
          else
            git commit -m 'Publish isolated Kiri integration preview (not production)'
            git push origin HEAD:main
          fi
